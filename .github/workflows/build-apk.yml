name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test engine and build APK
        working-directory: signal-app
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :engine:test :app:assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Publish APK release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TrueTrade Signals build ${{ github.run_number }}
          body: |
            Android APK for TrueTrade Signals (strategy version 3, breakout ensemble).
            Download app-debug.apk below on your phone and open it to install.
          files: signal-app/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true

      # Saves the full build log (pass or fail) to the 'ci-logs' branch, so it can be read without logging in.
      # Runs LAST: it clears the working folder.
      - name: Publish build log
        if: always()
        run: |
          STATUS="${{ job.status }}"
          cp build.log /tmp/build.log 2>/dev/null || echo "no log" > /tmp/build.log
          mkdir -p /tmp/reports
          cp -r signal-app/engine/build/test-results /tmp/reports/ 2>/dev/null || true
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git checkout --orphan ci-logs
          git rm -rf --cached . > /dev/null
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/build.log build.log
          cp -r /tmp/reports reports
          echo "$STATUS ${{ github.sha }} run ${{ github.run_number }}" > status.txt
          git add -A
          git commit -m "Build log for ${{ github.sha }} ($STATUS)"
          git push -f origin ci-logs
