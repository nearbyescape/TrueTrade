name: Build desktop app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-desktop
  cancel-in-progress: true

jobs:
  # Renders the window with simulated prices so the design can be reviewed, and publishes the log.
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Render screens
        continue-on-error: true
        working-directory: signal-app
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --continue :engine:test :desktop:test :desktop:renderScreens 2>&1 | tee "$GITHUB_WORKSPACE/desktop.log"
      - name: Publish
        if: always()
        run: |
          mkdir -p /tmp/out/screens
          cp desktop.log /tmp/out/ 2>/dev/null || true
          cp signal-app/desktop/build/screens/*.png /tmp/out/screens/ 2>/dev/null || true
          cp -r signal-app/desktop/build/test-results /tmp/out/desktop-test-results 2>/dev/null || true
          cp -r signal-app/engine/build/test-results /tmp/out/engine-test-results 2>/dev/null || true
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git checkout --orphan desktop-logs
          git rm -rf --cached . > /dev/null
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/out/. .
          echo "${{ job.status }} ${{ github.sha }} run ${{ github.run_number }}" > status.txt
          git add -A
          git commit -m "Desktop screens for ${{ github.sha }}"
          git push -f origin desktop-logs

  # The Windows installer (.exe).
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build installer
        shell: bash
        working-directory: signal-app
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :desktop:packageExe 2>&1 | tee "$GITHUB_WORKSPACE/windows.log"
      - name: Publish installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desk-${{ github.run_number }}
          name: TrueTrade Desk ${{ github.run_number }} (Windows)
          body: |
            Desktop app for Windows: her break-and-retest strategy with live 5m to daily charts.
            Download the .exe below and run it. Windows may say "Windows protected your PC" because the app
            isn't signed: click "More info", then "Run anyway". It installs for your user only (no admin needed).
          files: signal-app/desktop/build/compose/binaries/main/exe/*.exe
          make_latest: false
      - name: Publish log
        if: always()
        shell: bash
        run: |
          cp windows.log "$RUNNER_TEMP/windows.log" 2>/dev/null || echo "no log" > "$RUNNER_TEMP/windows.log"
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git checkout --orphan desktop-win-logs
          git rm -rf --cached . > /dev/null
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp "$RUNNER_TEMP/windows.log" windows.log
          ls signal-app 2>/dev/null || true
          echo "${{ job.status }} ${{ github.sha }} run ${{ github.run_number }}" > status.txt
          git add -A
          git commit -m "Windows build log for ${{ github.sha }}"
          git push -f origin desktop-win-logs
